# =========================
# Gemma-4-26B
# =========================
[gemma-4-26b]
model = /models/gemma-4-26B-A4B-it-UD-IQ4_XS.gguf

# Core performance
ctx-size = 64768
split-mode = none
fit-target = 128

flash-attn = true
jinja = true
split-mode = none
no-mmap = true

cache-type-k = q5_1
cache-type-v = q5_1

batch-size = 2048
ubatch-size = 256
threads = 32

reasoning = off

temperature = 1
top-k = 64
top-p = 0.95
min-p = 0.1

# Misc
no-warmup = true
repeat-penalty = 1.05
parallel = 1

