# =========================
# Qwen3.8-27B (100k context, 16GB VRAM)
# Dense 27B - IQ4_XS (15.7GB) nearly fits in 16GB,
# fit spills the remainder to CPU. KV cache is tiny
# (DeltaNet hybrid, only 4 Gated-Attention layers), so 100k ctx is cheap.
# =========================
[qwen-3.8-27b-100k]
model = /models/Qwen3.8-27B-IQ4_XS.gguf
ctx-size = 102400

# Fit: keep as many layers on GPU as possible, rest to CPU
fit = on
fit-target = 128
parallel = 1

flash-attn = true
jinja = true
split-mode = none
load-mode = none

# Cache compression
cache-type-k = q4_0
cache-type-v = q4_0

batch-size = 2048
ubatch-size = 256
threads = 32

reasoning = on
reasoning-effort = xhigh

# Qwen3.8 recommended sampling (thinking mode)
temperature = 1.0
top-k = 20
top-p = 0.95
min-p = 0.0
repeat-penalty = 1.0

# Misc
no-warmup = true

