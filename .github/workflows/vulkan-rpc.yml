name: Build Vulkan RPC image

on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: "llama.cpp git ref to build"
        required: true
        default: "master"
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone llama.cpp
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.llama_ref || 'master' }} https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Patch Dockerfile with GGML_RPC=ON
        run: |
          cd llama.cpp
          sed -i 's/-DGGML_NATIVE=OFF/-DGGML_NATIVE=OFF -DGGML_RPC=ON/' .devops/vulkan.Dockerfile
          grep -n "GGML_RPC" .devops/vulkan.Dockerfile

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          cd llama.cpp
          docker build --target full -f .devops/vulkan.Dockerfile -t ghcr.io/${{ github.repository_owner }}/llama-cpp-vulkan-rpc:latest .
          docker push ghcr.io/${{ github.repository_owner }}/llama-cpp-vulkan-rpc:latest
